name: Verify original pack sources
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install artwork renderer dependency
        run: python -m pip install Pillow==12.3.0
      - name: Verify authored quests, translations, artwork and benchmark calculations
        run: |
          python tools/generate_quests.py --check
          python tools/test_generate_quests.py
          python tools/test_sync_pack.py
          python tools/test_png_equivalence.py
          python tools/generate_integration_recipes.py --check
          python tools/build_survey_station_art.py --check
          python tools/build_atlas_book_art.py --check
          python art/build_art.py --check
          python art/build_pixel_identity.py --check
          python tools/check_runtime_content.py
          python tools/benchmark.py --self-test
          python tools/test_benchmark.py
          python tools/check_more_machine_balance.py --self-test
          python tools/test_optional_loot_compat.py
          python tools/test_aircraft_balance.py
          python -W error::ResourceWarning tools/test_runtime_control.py
      - name: Build companion and exercise Minecraft APIs with isolated item fixtures
        working-directory: companion
        run: bash ./gradlew test build runGameTestServer qaJar --no-daemon
      - name: Keep QA classes and synthetic items out of the distributable mod
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          jars = list(Path('companion/build/libs').glob('*.jar'))
          normal = next(p for p in jars if not p.stem.endswith('-qa'))
          qa = next(p for p in jars if p.stem.endswith('-qa'))
          with zipfile.ZipFile(normal) as z:
              assert not any('GameTest' in p or 'FullpackQA' in p for p in z.namelist())
              assert 'data/entrelumen/structure/empty.nbt' not in z.namelist()
          with zipfile.ZipFile(qa) as z:
              assert 'dev/entrelumen/FullpackQABootstrap.class' in z.namelist()
              assert not any('GameTestFixture' in p for p in z.namelist())
          PY
