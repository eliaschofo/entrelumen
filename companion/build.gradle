plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.146'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')

    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    gameTestFixture
    fullpackGameTest
}

sourceSets.fullpackGameTest.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
sourceSets.fullpackGameTest.runtimeClasspath += sourceSets.main.runtimeClasspath

neoForge {
    version = project.neo_version

    addModdingDependenciesTo sourceSets.gameTestFixture
    addModdingDependenciesTo sourceSets.fullpackGameTest

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }


    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        entrelumen_gametest_fixture {
            sourceSet(sourceSets.gameTestFixture)
        }
    }

    runs {
        client {
            client()
            loadedMods = [mods.entrelumen]
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            loadedMods = [mods.entrelumen]
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            loadedMods = [mods.entrelumen, mods.entrelumen_gametest_fixture]
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            loadedMods = [mods.entrelumen]

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.INFO
        }
    }

}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}


dependencies {
    // Official Default Options 21.1.8 NeoForge upload; compile API only, never bundle it.
    compileOnly 'maven.modrinth:WEg59z5b:1zt17WsC'
    implementation 'dev.ftb.mods:ftb-teams-neoforge:2101.1.11'
    implementation 'dev.ftb.mods:ftb-library-neoforge:2101.1.35'
    implementation 'dev.architectury:architectury-neoforge:13.0.11'
    implementation 'dev.ftb.mods:ftb-quests-neoforge:2101.1.34'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform() }


repositories {
    mavenCentral()
    maven { url = 'https://maven.ftb.dev/releases' }
    maven { url = 'https://maven.architectury.dev' }
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
}
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

tasks.named('jar') {
    exclude 'dev/entrelumen/RuntimeGameTests*.class'
    exclude 'data/entrelumen/structure/empty.nbt'
    from('../LICENSE')
    from('TEMPLATE_LICENSE.txt')
    from('NOTICE.txt')
}

tasks.register('qaJar', Jar) {
    description = 'Non-distributable full-pack GameTest JAR; use instead of the release JAR.'
    archiveClassifier = 'qa'
    from(sourceSets.main.output)
    from(sourceSets.fullpackGameTest.output)
    from('../LICENSE')
    from('TEMPLATE_LICENSE.txt')
    from('NOTICE.txt')
}
