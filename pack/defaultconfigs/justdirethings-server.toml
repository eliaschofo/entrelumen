# ENTRELUMEN default for new worlds: the Time Wand tops out at 8x instead of 256x (32 times weaker).
# Elias, 29 September 2026: "hacé que tenga mucha menos efectividad, tipo x32 menos efectivo".
# The wand doubles per click (2x, 4x, 8x); the cap is a power of two, so 8 leaves three steps.
# FE and Time Fluid costs per step stay native (100 FE and 0.5 mB per unit of speed), so a full 8x costs
# 800 FE and 4 mB instead of 25600 FE and 128 mB. Existing worlds keep their own serverconfig/ file.
[time_wand]
	time_wand_max_multiplier = 8
