# ENTRELUMEN: players start with an empty inventory (story bible, "Inicio sin bloat").
# The Material Book stays craftable; the starter blueprint package is a pure gift and is not
# handed out. Blueprints and templates themselves are crafted as usual.
[item.blueprint]
	spawn_with_starter_blueprints = false

[item.material_book]
	spawn_with_material_book = false
