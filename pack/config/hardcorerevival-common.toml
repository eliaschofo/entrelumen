# ENTRELUMEN: Hardcore Revival is a co-op feature (Elias, 28 September; docs/design/mod-pingpong.md, Ronda 7).
# Alone, nobody can rescue you, so a knockout would only delay death: single player and a server with one
# player online keep the normal death. Every other key keeps Hardcore Revival 21.1.22's default
# (two minutes to be rescued, two seconds to rescue within three blocks; lava and the void kill outright).
disableInSingleplayer = true
disableInLonelyMultiplayer = true
